        <text x="258" y="209" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CHECKOUT</text>
        <!-- Connectors (behind nodes) -->
