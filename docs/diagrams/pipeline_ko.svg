<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline_ko-title pipeline_ko-desc" id="pipeline_ko-root">
        <title id="pipeline_ko-title">공모전 하나가 하네스를 거치는 과정</title>
        <desc id="pipeline_ko-desc">스윔레인 다이어그램: harness CLI가 공고를 수집하고, 에이전트가 게이트를 판정하고, CLI가 라우팅하고 실행하며, 에이전트가 레벨대로 작업하고, CLI가 점수와 페르소나 흔적을 검사하고, 사용자가 승인하면 에이전트가 제출한다. 레벨 5는 계획 검토에서 한 번 더 멈춘다.</desc>
        <defs>
      <style>#pipeline_ko-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #pipeline_ko-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pipeline_ko-root .diagram-container { width: 100%; overflow-x: auto; }
      #pipeline_ko-root .diagram-container { overflow-x: visible; }</style>
          <marker id="pipeline_ko-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
