      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture_ko-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture_ko-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture_ko-root .diagram-container { overflow-x: visible; }</style>
