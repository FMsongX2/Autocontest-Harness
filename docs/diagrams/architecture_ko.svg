<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture_ko-title architecture_ko-desc" id="architecture_ko-root">
        <title id="architecture_ko-title">Autocontest-Harness 구성</title>
        <desc id="architecture_ko-desc">구성도: 사용자와 스케줄러가 harness CLI를 부르고, CLI만 data/를 쓰며 공고를 수집하고 공모전 폴더를 만들고 작업 환경에 에이전트 세션을 띄운다. 에이전트는 CLI를 다시 부르고 공모전 폴더에 커밋한다.</desc>
        <defs>
      <style>#architecture_ko-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture_ko-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture_ko-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture_ko-root .diagram-container { overflow-x: visible; }</style>
