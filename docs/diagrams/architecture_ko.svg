<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture_ko-title architecture_ko-desc" id="architecture_ko-root">
        <title id="architecture_ko-title">Autocontest-Harness 구성</title>
        <desc id="architecture_ko-desc">구성도: 사용자는 메인 세션과 대화하고, 메인 세션이 하네스 코어 ach를 부른다. 스케줄러도 정기 실행을 띄운다. data/는 ach만 쓰고, ach가 HTTP로 공고를 수집하고, 공모전 폴더를 만들고, 작업 환경에 공모전 세션을 띄운다. 공모전 세션은 ach를 다시 부르고 자기 폴더에 커밋한다.</desc>
