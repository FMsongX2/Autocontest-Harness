수 있습니다.\n- 제출된 응모작은 반환하지 않으며, 타인 작품의 도용ㆍ표절 등으로 발생하는 모든 법적 책임은 응모자에게 있습니다.\n- 점수 등 심사 과정의 내부사항은 공개하지 않으며, 결과에 대한 이의제기 및 재심 요청은 불가합니다.\n- 수상작에 대해 도용ㆍ표절 등 부정행위가 확인될 경우 자동 탈락 및 시상금 환수 조치 됩니다.\n- 수상작은 수상자와의 합의를 거쳐 문안선정위원회를 통해 수정될 수 있으며, 심사 결과에 따라 수상범위가 달라질 수 있습니다.\n\n● 문의 사항\n- 카카오톡채널 : 춘천봄내글판\n- 운영시간: 평일 10:00~18:00","image_thumb":"1791888562247741_thumb.jpg","image":"1791888562247741.jpg","view_count":180,"comment_count":0,"team_count":0,"created_at":"2026-10-14 17:37:22","updated_at":"0000-00-00 00:00:00","manager_id":28332,"online_type":0,"price":0,"region":"null","is_scrapped":0},"categories":[102,107,101],"image":"https://cf-tabs-image.campuspick.com/activity/1791888562247741.jpg","imageThumb":"https://cf-tabs-image.campuspick.com/activity/1791888562247741_thumb.jpg","isScrapped":0}</script>
